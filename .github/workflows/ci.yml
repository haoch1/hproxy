name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        run: npm ci --prefix web && npm run build --prefix web
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
      - name: Test controller and agent
        run: cargo test --workspace --locked
      - name: Test agent package assembly
        run: python3 -m unittest discover -s tests
      - name: Test patched Realm data path
        run: cargo test --manifest-path vendor/realm/Cargo.toml -p realm_core --no-default-features --features batched-udp --lib --locked
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dashboard
          path: web/dist/
          retention-days: 3

  binaries:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: web/dist/
      - name: Install Rust target and cross
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install cross --version 0.2.5 --locked
      - name: Build static controller and agent
        run: |
          mkdir -p release-binaries
          cross build --release --locked --target x86_64-unknown-linux-musl --package hproxy-server --package hproxy-agent
          cp target/x86_64-unknown-linux-musl/release/hproxy-server release-binaries/hproxy-server-linux-amd64
          cp target/x86_64-unknown-linux-musl/release/hproxy-agent release-binaries/hproxy-agent-linux-amd64
      - name: Build patched static Realm
        run: |
          cross build --manifest-path vendor/realm/Cargo.toml --release --locked \
            --target x86_64-unknown-linux-musl --no-default-features \
            --features proxy,balance,multi-thread,batched-udp,brutal-shutdown --bin realm
          cp vendor/realm/target/x86_64-unknown-linux-musl/release/realm release-binaries/realm-linux-amd64
      - name: Fetch pinned static sing-box
        run: python3 scripts/fetch-sing-box.py --platform linux-amd64 --output release-binaries
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: release-binaries/
          retention-days: 3
          compression-level: 0

  package:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: release-binaries/
      - name: Validate amd64 controller and agent package
        run: python3 scripts/package-release.py --input release-binaries --output release-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 7
          compression-level: 0

  images:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Controller image metadata
        id: controller
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=hproxy
            org.opencontainers.image.description=Linux 代理节点与端口转发主控
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
      - name: Publish controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.controller.outputs.tags }}
          labels: ${{ steps.controller.outputs.labels }}
          cache-from: type=gha,scope=controller
          cache-to: type=gha,scope=controller,mode=max
  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - name: Start controller and check native agent binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          controller="ghcr.io/${GITHUB_REPOSITORY}:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$controller"
          bundle_container=$(docker create "$controller")
          docker cp "$bundle_container:/opt/hproxy/release/hproxy-agent-linux-amd64" "$RUNNER_TEMP/hproxy-agent"
          docker rm "$bundle_container"
          chmod +x "$RUNNER_TEMP/hproxy-agent"
          "$RUNNER_TEMP/hproxy-agent" --version
          docker volume create hproxy-server-smoke-data
          trap 'docker rm -f hproxy-server-smoke >/dev/null 2>&1 || true; docker volume rm hproxy-server-smoke-data >/dev/null 2>&1 || true' EXIT
          printf 'hproxy-smoke-password-123\n' | docker run --rm -i \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            -v hproxy-server-smoke-data:/var/lib/hproxy/server \
            --entrypoint /usr/local/bin/hproxy-server-init "$controller" init
          docker run -d --name hproxy-server-smoke \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v hproxy-server-smoke-data:/var/lib/hproxy/server \
            -p 127.0.0.1:19080:19080 "$controller" \
            run --data /var/lib/hproxy/server --downloads /opt/hproxy/release \
            --listen 0.0.0.0:19080 --public-url https://example.com
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:19080/healthz; then
            docker logs hproxy-server-smoke
            exit 1
          fi
          docker exec hproxy-server-smoke hproxy-server check --data /var/lib/hproxy/server
